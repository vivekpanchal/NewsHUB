plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.kapt)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.hilt.android)
}

// Secrets (NEWS_API_KEY, ADMOB_APP_ID, ADMOB_BANNER_AD_UNIT_ID, signing credentials) are read
// from the gitignored local.properties file, e.g.:
//   NEWS_API_KEY=yourNewsApiOrgKeyHere
//   ADMOB_APP_ID=ca-app-pub-xxxxxxxxxxxxxxxx~yyyyyyyyyy
//   ADMOB_BANNER_AD_UNIT_ID=ca-app-pub-xxxxxxxxxxxxxxxx/yyyyyyyyyy
//   RELEASE_KEY_ALIAS=key
//   RELEASE_KEY_PASSWORD=yourKeyPasswordHere
//   RELEASE_STORE_PASSWORD=yourStorePasswordHere
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def newsApiKey = localProperties.getProperty('NEWS_API_KEY', '')
// Defaults below are Google's official AdMob *test* IDs - safe for development builds.
def admobAppId = localProperties.getProperty('ADMOB_APP_ID', 'ca-app-pub-3940256099942544~3347511713')
def admobBannerAdUnitId = localProperties.getProperty('ADMOB_BANNER_AD_UNIT_ID', 'ca-app-pub-3940256099942544/6300978111')
def releaseKeyAlias = localProperties.getProperty('RELEASE_KEY_ALIAS', 'key')
def releaseKeyPassword = localProperties.getProperty('RELEASE_KEY_PASSWORD', '')
def releaseStorePassword = localProperties.getProperty('RELEASE_STORE_PASSWORD', '')

android {
    namespace 'com.vivekpanchal.newshub'
    compileSdk 34

    signingConfigs {
        config {
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
            storeFile file('../app/keystore.jks')
            storePassword releaseStorePassword
        }
    }

    defaultConfig {
        applicationId "com.vivekpanchal.newshub"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
    }

    buildTypes.each {
        it.buildConfigField 'String', 'NEWS_API_KEY', "\"$newsApiKey\""
        it.resValue "string", "admob_app_id", admobAppId
        it.buildConfigField 'String', 'ADMOB_BANNER_AD_UNIT_ID', "\"$admobBannerAdUnitId\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Needed for java.time.* (used for news date parsing) on minSdk 24.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation platform(libs.compose.bom)
    androidTestImplementation platform(libs.compose.bom)

    // Core / Compose
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.activity.compose
    implementation libs.compose.ui
    implementation libs.compose.ui.tooling.preview
    debugImplementation libs.compose.ui.tooling
    implementation libs.compose.material3
    implementation libs.compose.material.icons.extended
    implementation libs.lifecycle.runtime.compose
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.navigation.compose

    // Coroutines
    implementation libs.kotlinx.coroutines.android
    // Immutable collections for Compose-stable UI state (see MviViewModel-based Contract state classes)
    implementation libs.kotlinx.collections.immutable

    // Hilt
    implementation libs.hilt.android
    kapt libs.hilt.android.compiler
    implementation libs.hilt.navigation.compose
    implementation libs.hilt.work
    kapt libs.hilt.compiler

    // Networking
    implementation libs.retrofit.core
    implementation libs.retrofit.gson
    implementation libs.okhttp.logging.interceptor

    // Room
    implementation libs.room.runtime
    implementation libs.room.ktx
    kapt libs.room.compiler

    // DataStore (replaces SharedPreferences)
    implementation libs.datastore.preferences

    // Image loading (replaces Picasso)
    implementation libs.coil.compose

    // WorkManager (replaces IntentService for widget refresh)
    implementation libs.work.runtime.ktx

    // App widget (replaces RemoteViews based NewsWidgetProvider)
    implementation libs.glance.appwidget

    // Ads
    implementation libs.play.services.ads

    coreLibraryDesugaring libs.desugar.jdk.libs

    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.compose.ui.test.junit4
    debugImplementation libs.compose.ui.test.manifest
}
