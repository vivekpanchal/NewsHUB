apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'kotlin-parcelize'
apply plugin: 'dagger.hilt.android.plugin'

// Secrets (NEWS_API_KEY, ADMOB_APP_ID, ADMOB_BANNER_AD_UNIT_ID) are read from the gitignored
// local.properties file, e.g.:
//   NEWS_API_KEY=yourNewsApiOrgKeyHere
//   ADMOB_APP_ID=ca-app-pub-xxxxxxxxxxxxxxxx~yyyyyyyyyy
//   ADMOB_BANNER_AD_UNIT_ID=ca-app-pub-xxxxxxxxxxxxxxxx/yyyyyyyyyy
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def newsApiKey = localProperties.getProperty('NEWS_API_KEY', '')
// Defaults below are Google's official AdMob *test* IDs - safe for development builds.
def admobAppId = localProperties.getProperty('ADMOB_APP_ID', 'ca-app-pub-3940256099942544~3347511713')
def admobBannerAdUnitId = localProperties.getProperty('ADMOB_BANNER_AD_UNIT_ID', 'ca-app-pub-3940256099942544/6300978111')

android {
    namespace 'com.vivekpanchal.newshub'
    compileSdk 34

    signingConfigs {
        config {
            keyAlias 'key'
            keyPassword 'CapstoneDone'
            storeFile file('../app/keystore.jks')
            storePassword 'CapstoneDone'
        }
    }

    defaultConfig {
        applicationId "com.vivekpanchal.newshub"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
    }

    buildTypes.each {
        it.buildConfigField 'String', 'NEWS_API_KEY', "\"$newsApiKey\""
        it.resValue "string", "admob_app_id", admobAppId
        it.buildConfigField 'String', 'ADMOB_BANNER_AD_UNIT_ID', "\"$admobBannerAdUnitId\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Needed for java.time.* (used for news date parsing) on minSdk 24.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    def compose_bom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation compose_bom
    androidTestImplementation compose_bom

    // Core / Compose
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.1'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Hilt
    implementation 'com.google.dagger:hilt-android:2.51.1'
    kapt 'com.google.dagger:hilt-android-compiler:2.51.1'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    implementation 'androidx.hilt:hilt-work:1.2.0'
    kapt 'androidx.hilt:hilt-compiler:1.2.0'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // DataStore (replaces SharedPreferences)
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Image loading (replaces Picasso)
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // WorkManager (replaces IntentService for widget refresh)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // App widget (replaces RemoteViews based NewsWidgetProvider)
    implementation 'androidx.glance:glance-appwidget:1.1.0'

    // Ads
    implementation 'com.google.android.gms:play-services-ads:23.1.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
